name: Public showcase checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install public runtime dependencies
        run: python -m pip install -e .

      - name: Run public showcase tests
        run: >-
          python -m pytest -q
          tests/test_public_showcase_examples.py
          tests/test_hd_market_expectations_demo.py
          tests/test_market_expectations_paper_package.py
